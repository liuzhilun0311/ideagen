services:
  ideagen:
    build: .
    image: ideagen-django:latest
    container_name: ideagen-django
    ports:
      - "12398:12398"
    environment:
      # 初始管理员密码（首次创建 admin 账号时生效；后续改密码请用管理界面）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DJANGO_DEBUG: "False"
    volumes:
      # 持久化数据（图片、历史记录、输出）
      - ./history:/app/history
      - ./output:/app/output
      - ./user_configs:/app/user_configs
      - ./data:/app/data
      # 服务商配置（宿主机编辑后生效，含 API Key；模板见项目根 *.yaml.example）
      - ./image_providers.yaml:/app/image_providers.yaml
      - ./text_providers.yaml:/app/text_providers.yaml
    restart: unless-stopped
