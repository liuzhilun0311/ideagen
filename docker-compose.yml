x-runtime: &runtime
  build: .
  image: ideagen-django:local
  user: "${IDEAGEN_UID:-10001}:${IDEAGEN_GID:-10001}"
  init: true
  environment:
    DJANGO_DEBUG: "False"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  volumes:
    - ./history:/app/history
    - ./output:/app/output
    - ./user_configs:/app/user_configs
    - ./data:/app/data
    - type: bind
      source: ./image_providers.yaml
      target: /app/image_providers.yaml
      bind:
        create_host_path: false
    - type: bind
      source: ./text_providers.yaml
      target: /app/text_providers.yaml
      bind:
        create_host_path: false
  restart: unless-stopped
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ideagen:
    <<: *runtime
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-12398}:12398"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:12398/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  image-worker:
    <<: *runtime
    command: ["worker"]
    depends_on:
      ideagen:
        condition: service_healthy
